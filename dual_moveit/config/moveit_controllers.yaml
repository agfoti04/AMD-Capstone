# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - both_arms_controller

  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - left_Joint_1
      - left_Joint_2
      - left_Joint_3
      - left_Joint_4
      - left_Joint_6
  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - right_Joint_1
      - right_Joint_2
      - right_Joint_3
      - right_Joint_4
      - right_Joint_6
  both_arms_controller:
    type: FollowJointTrajectory
    joints:
      - left_Joint_1
      - left_Joint_2
      - left_Joint_3
      - left_Joint_4
      - left_Joint_6
      - right_Joint_1
      - right_Joint_2
      - right_Joint_3
      - right_Joint_4
      - right_Joint_6