controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: effort_controllers/JointGroupEffortController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

arm_controller:
  ros__parameters:
    joints: [Joint_1, Joint_2, Joint_3, Joint_4, Joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    use_sim_time: true

gripper_controller:
  ros__parameters:
    joints: [Joint_Gripper]
    interface_name: effort
    use_sim_time: true