controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# Same as controllers.yaml, minus use_stamped_vel. Jazzy only accepts
# TwistStamped on /diff_drive_controller/cmd_vel; twist_stamper converts /cmd_vel.
diff_drive_controller:
  ros__parameters:
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]
    wheel_separation: 0.24
    wheel_radius: 0.05
    wheel_separation_multiplier: 1.5   # retune for Harmonic physics if turns under- or over-rotate
    odom_frame_id: odom
    base_frame_id: base_link
    publish_rate: 50.0
    enable_odom_tf: false
    open_loop: false
    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 0.6
    angular.z.max_velocity: 1.5
