[package]
name = "example_interfaces"
version = "0.14.1"
edition = "2021"

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# ROS Dependencies
service_msgs = "*"
unique_identifier_msgs = "*"
action_msgs = "*"
builtin_interfaces = "*"

[features]
serde = ['dep:serde', 'dep:serde-big-array', 'rosidl_runtime_rs/serde', 'service_msgs/serde', 'unique_identifier_msgs/serde', 'action_msgs/serde', 'builtin_interfaces/serde']

[package.metadata.ros-env]
include = true
